version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 5
    # Grouped updates: one PR for all action bumps rather than one per action.
    groups:
      github-actions:
        patterns:
          - "*"
