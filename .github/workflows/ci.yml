name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

# Supersedes the old cancel.yml / styfle/cancel-workflow-action pattern:
# GitHub cancels superseded runs natively per ref.
# github.ref is unique per pull request (refs/pull/N/merge). github.head_ref
# is only the branch name, so two fork PRs sharing a branch name would land in
# the same group and cancel each other's checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP syntax
        run: git ls-files '*.php' | xargs -r -n1 -P4 php -l
